name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Gmsh needs these system libraries; without Gmsh the mesh tests are skipped.
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2
      - run: pip install -r pore_generator/requirements-mesh.txt
      - run: python -m unittest discover -s pore_generator/tests -v
