[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sem2msh"
version = "0.1.0"
description = "Calibrated 2D SEM image to Gmsh mesh API"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "shapely>=2",
  "gmsh>=4.11",
]

[tool.setuptools.packages.find]
include = ["sem2msh*", "benchmark*"]
